<?xml version="1.0" encoding="UTF-8"?>
<svg width="360" height="260" viewBox="0 0 360 260" fill="none" xmlns="http://www.w3.org/2000/svg">

    <defs>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.15"/>
        </filter>
    </defs>

    <!-- Card -->
    <rect
        x="10"
        y="10"
        width="340"
        height="240"
        rx="18"
        fill="white"
        filter="url(#shadow)"/>

    <!-- Title -->
    <text
        x="30"
        y="48"
        font-family="Segoe UI, Arial"
        font-size="24"
        font-weight="700"
        fill="#11195E">
        Football Minigame
    </text>

    <!-- Description -->
    <text
        x="30"
        y="82"
        font-family="Segoe UI, Arial"
        font-size="15"
        fill="#555555">

        <tspan x="30" dy="0">
            Play as a football and protect your goal
        </tspan>

        <tspan x="30" dy="22">
            from enemy balls trying to score.
        </tspan>

        <tspan x="30" dy="30">
            I developed the core gameplay mechanics,
        </tspan>

        <tspan x="30" dy="22">
            allowing the player to control the ball
        </tspan>

        <tspan x="30" dy="22">
            and push enemies away from their goal.
        </tspan>

    </text>

    <!-- Tags -->
    <rect x="30" y="200" width="58" height="28" rx="14" fill="#E8EEFF"/>
    <text x="59" y="218"
          text-anchor="middle"
          font-family="Segoe UI"
          font-size="13"
          font-weight="600"
          fill="#11195E">
        Unity
    </text>

    <rect x="98" y="200" width="42" height="28" rx="14" fill="#E8EEFF"/>
    <text x="119" y="218"
          text-anchor="middle"
          font-family="Segoe UI"
          font-size="13"
          font-weight="600"
          fill="#11195E">
        C#
    </text>

</svg>
