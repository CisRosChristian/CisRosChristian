<?xml version="1.0" encoding="UTF-8"?>
<svg width="360"
     height="450"
     viewBox="0 0 360 450"
     fill="none"
     xmlns="http://www.w3.org/2000/svg">

    <defs>

        <!-- Shadow -->
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow
                dx="0"
                dy="6"
                stdDeviation="8"
                flood-color="#000000"
                flood-opacity="0.15"/>
        </filter>

        <!-- Rounded corners for image -->
        <clipPath id="imageClip">
            <rect
                x="10"
                y="20"
                width="340"
                height="190"
                rx="18"/>
        </clipPath>

    </defs>

    <!-- Card -->
    <rect
        x="10"
        y="10"
        width="340"
        height="430"
        rx="18"
        fill="white"
        filter="url(#shadow)"/>

    <!-- Image -->
    <image
        href="YOUR_IMAGE_URL"
        x="10"
        y="20"
        width="340"
        height="190"
        clip-path="url(#imageClip)"
        preserveAspectRatio="xMidYMid slice"/>

    <!-- Title -->
    <text
        x="30"
        y="245"
        font-family="Segoe UI, Arial"
        font-size="24"
        font-weight="700"
        fill="#11195E">
        Football Minigame
    </text>

    <!-- Description -->
    <text
        x="30"
        y="278"
        font-family="Segoe UI, Arial"
        font-size="15"
        fill="#555555">

        <tspan x="30" dy="0">
            Play as a football and protect your goal
        </tspan>

        <tspan x="30" dy="22">
            from enemy balls trying to score.
        </tspan>

        <tspan x="30" dy="30">
            I developed the core gameplay mechanics,
        </tspan>

        <tspan x="30" dy="22">
            allowing the player to control the ball
        </tspan>

        <tspan x="30" dy="22">
            and push enemies away from their goal.
        </tspan>

       <tspan x="30" dy="40">
           From this project,
        </tspan>

        <tspan x="30" dy="32">
            I learnt some basics of game design,
        </tspan>

        <tspan x="30" dy="32">
            such as the use of courutines and spawner with
        </tspan>

        <tspan x="30" dy="32">
            levels and cooldowns for power ups.
        </tspan>         

    </text>

    <!-- Tags -->

    <rect
        x="30"
        y="375"
        width="58"
        height="28"
        rx="14"
        fill="#E8EEFF"/>

    <text
        x="59"
        y="393"
        text-anchor="middle"
        font-family="Segoe UI"
        font-size="13"
        font-weight="600"
        fill="#11195E">
        Unity
    </text>

    <rect
        x="98"
        y="375"
        width="42"
        height="28"
        rx="14"
        fill="#E8EEFF"/>

    <text
        x="119"
        y="393"
        text-anchor="middle"
        font-family="Segoe UI"
        font-size="13"
        font-weight="600"
        fill="#11195E">
        C#
    </text>

</svg>
